[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-domain-sentiment-pipeline"
version = "0.1.0"
description = "Data-centric multi-agent pipeline for Amazon and Steam review sentiment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "PyYAML>=6.0",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "seaborn>=0.13",
]

[project.scripts]
data-agent-pipeline = "run_pipeline:main"

[project.optional-dependencies]
annotation = ["torch>=2.4", "transformers>=4.45"]
ui = ["streamlit>=1.39"]
notebooks = ["jupyter>=1.1", "nbformat>=5.10"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7"]

[tool.setuptools]
packages = ["agents", "pipeline", "utils"]
py-modules = [
  "run_pipeline",
  "hitl_app",
  "data_collection_agent",
  "data_quality_agent",
  "annotation_agent",
  "al_agent",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["network: tests that require live network access"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".runtime",
  ".venv",
  ".venv.codex-backup-*",
  "data",
  "models",
  "reports",
  "notebooks",
]
